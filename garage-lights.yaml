esphome:
  name: garage-lights
  friendly_name: Garage Light Switch
  comment: Sonoff two button light switch with sunrise/sunset automation
  on_boot:
    then:
      light.turn_on: garage_lights

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 10min

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: "3dad87c4b30e5239012b8e37ce1dc1c7"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Garage-Lights Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

sun:
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  on_sunrise:
    - then:
        - light.turn_off: carport_light
  on_sunset:
    - then:
        - light.turn_on: carport_light

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    name: "Button 1"
    on_press:
      then:
        - light.toggle: garage_lights
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_2
    name: "Button 2"
    on_press:
      then:
        - light.toggle: carport_light

output:
  - platform: esp8266_pwm
    id: blue_led
    pin: GPIO13
    inverted: true
  - platform: gpio
    pin: GPIO12
    id: relay1
  - platform: gpio
    pin: GPIO5
    id: relay2

light:
  - platform: binary
    name: "Garage Lights"
    output: relay1
    id: garage_lights
    on_turn_on:
      - output.turn_on: blue_led
    on_turn_off:
      - output.turn_off: blue_led
  - platform: binary
    name: "Carport Lights"
    output: relay2
    id: carport_light

sensor:
  - platform: wifi_signal
    name: "WiFi signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy
    source_id: wifi_signal_db
    device_class: ""
    name: "WiFi signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: "diagnostic"

text_sensor:
  - platform: sun
    name: "Next Sunrise"
    type: sunrise
  - platform: sun
    name: "Next Sunset"
    type: sunset