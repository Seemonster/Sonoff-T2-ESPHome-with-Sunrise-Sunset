esphome:
  name: garage-lights
  friendly_name: Garage Light Switch
  comment: Sonoff two button light switch
  on_boot:
    then:
      light.turn_on: garage_lights

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 10min

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Garage-Lights Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    on_press:
      then:
        - light.toggle: garage_lights
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_2
    on_press:
      then:
        - light.toggle: carport_light

output:
  - platform: esp8266_pwm
    id: blue_led
    pin: GPIO13
    inverted: true
  - platform: gpio
    pin: GPIO12
    id: relay1
  - platform: gpio
    pin: GPIO5
    id: relay2

light:
  - platform: binary
    name: "Garage Lights"
    output: relay1
    id: garage_lights
  - platform: binary
    name: "Carport Lights"
    output: relay2
    id: carport_light

sensor:
  - platform: wifi_signal
    name: "WiFi signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy
    source_id: wifi_signal_db
    device_class: ""
    name: "WiFi signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
    internal: true

text_sensor:
  - platform: homeassistant
    id: sun_text_state
    entity_id: sun.sun
    internal: true

script:
  - id: check_sun
    then:
      - if:
          condition:
            lambda: 'return id(sun_text_state).state == "below_horizon";'
          then:
            - light.turn_on: carport_light
          else:
            - light.turn_off: carport_light

interval:
  - interval: 60s
    then:
      - script.execute: check_sun
